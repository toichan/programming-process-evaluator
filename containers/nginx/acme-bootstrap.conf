worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 64; }

http {
    access_log off;
    server_tokens off;

    server {
        listen 127.0.0.1:8081;
        location = /_acme_health { return 200 "ok\n"; }
        location / { return 404; }
    }

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name student.ppeval.net teacher.ppeval.net;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / { return 404; }
    }
}
