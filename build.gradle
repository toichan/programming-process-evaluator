buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.flywaydb:flyway-mysql:13.9.0'
    }
}

plugins {
    id 'java'
    id 'java-library'
    id 'war'
    id 'org.flywaydb.flyway' version '13.9.0'
    id 'org.gretty' version '3.1.9'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'javax.servlet.jsp.jstl', name: 'jstl-api', version: '1.2'

    implementation 'com.google.code.gson:gson:2.13.1'
    runtimeOnly group: 'org.glassfish.web', name: 'jstl-impl', version: '1.2'
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'com.zaxxer:HikariCP:6.3.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'

    providedCompile 'javax.servlet:javax.servlet-api:3.1.0'

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

gretty {
    servletContainer = 'tomcat9'
    contextPath = '/'
}

flyway {
    url = "jdbc:mysql://${System.getenv('DB_HOST') ?: 'localhost'}:${System.getenv('DB_PORT') ?: '3306'}/${System.getenv('DB_NAME') ?: 'programming_process_evaluator'}"
    user = System.getenv('DB_USER')
    password = System.getenv('DB_PASSWORD')
    locations = ['filesystem:src/main/resources/db/migration']
    cleanDisabled = true
}

jar {
    manifest {
        attributes 'Main-Class': ''
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('rotateAdminPassword', JavaExec) {
    group = 'application'
    description = 'Generate and set a new strong password for the active administrator account.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'control.auth.RotateAdminPassword'
    standardInput = System.in
}

tasks.register('registerStandardRubric', JavaExec) {
    group = 'application'
    description = 'Register the approved 0805 standard rubric without overwriting existing versions.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'control.student.StandardRubricBootstrap'
}

tasks.register('seedDemoData', JavaExec) {
    group = 'application'
    description = 'Create one-time synthetic teacher, school, class, and task data in the local Compose database.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'control.dev.DemoDataBootstrap'
}
