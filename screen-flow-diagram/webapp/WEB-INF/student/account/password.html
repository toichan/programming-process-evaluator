<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Process Evaluator - パスワード変更</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="../../../css/student/shared/components.css" rel="stylesheet">
  <link href="../../../css/student/shared/feedback.css" rel="stylesheet">
  <link href="../../../css/template/template.css" rel="stylesheet">
  <link href="../../../css/student/account/password.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <section class="sample-section password-hero mb-4">
        <div class="hero-copy">
          <span class="hero-kicker">Password Update</span>
          <h1 class="section-title mb-3">パスワード変更</h1>
          <p class="hero-description mb-0">
            パスワードの変更を行えます。パスワードを忘れた場合は、右上のヘルプボタンから、「パスワードの初期化依頼」を出してください。
          </p>
        </div>

        <div class="hero-status-card">
          <div class="status-label">現在の状態</div>
          <div class="status-value">変更が必要です</div>
          <div class="status-meta">新しいパスワードを設定すると、通常の課題画面へ進めます。</div>
        </div>
      </section>

      <div class="row g-4 align-items-start password-content-row">
        <div class="col-12 col-xl-7">
          <section class="sample-section password-form-section">
            <div class="section-heading-row mb-4">
              <div>
                <h2 class="card-title mb-2">変更フォーム</h2>
                <p class="text-muted mb-0">現在のパスワードと新しいパスワードを入力してください。</p>
              </div>
            </div>

            <form id="passwordChangeForm" class="password-form" action="#" method="post">
              <div class="field-block">
                <div class="field-header-row">
                  <label class="field-label" for="currentPassword">現在のパスワード</label>
                  <span class="required-badge">必須</span>
                </div>
                <div class="password-input-wrap">
                  <input id="currentPassword" class="form-control form-control-lg" type="password" placeholder="現在のパスワードを入力">
                  <button class="password-visibility-toggle" type="button" data-password-toggle="currentPassword" aria-label="現在のパスワードを表示">
                    <svg class="password-toggle-icon password-toggle-show" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                      <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.12 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"></path>
                      <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM6.5 8a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0z"></path>
                    </svg>
                    <svg class="password-toggle-icon password-toggle-hide" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                      <path d="M13.359 11.238C14.428 10.141 15.141 8.99 15.562 8c-.74-1.739-2.878-4.5-7.562-4.5-1.153 0-2.188.167-3.118.468l.787.787A8.99 8.99 0 0 1 8 4.5c3.866 0 5.79 2.14 6.59 3.5-.278.473-.709 1.12-1.317 1.778l.086.086z"></path>
                      <path d="M11.297 9.176a3.5 3.5 0 0 0-4.473-4.473l.823.823a2.5 2.5 0 0 1 2.827 2.827l.823.823z"></path>
                      <path d="M4.11 5.696A13.346 13.346 0 0 0 1.613 8c.795 1.36 2.719 3.5 6.387 3.5 1.294 0 2.397-.266 3.334-.697l.77.77C11.013 12.181 9.64 12.5 8 12.5 3.316 12.5 1.178 9.739.438 8c.45-1.053 1.282-2.336 2.466-3.462l1.206 1.158z"></path>
                      <path d="M3.354 1.646a.5.5 0 1 0-.708.708l10 10a.5.5 0 0 0 .708-.708l-10-10z"></path>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="field-block">
                <div class="field-header-row">
                  <label class="field-label" for="newPassword">新しいパスワード</label>
                  <span class="required-badge">必須</span>
                </div>
                <div class="password-input-wrap">
                  <input id="newPassword" class="form-control form-control-lg" type="password" placeholder="新しいパスワードを入力">
                  <button class="password-visibility-toggle" type="button" data-password-toggle="newPassword" aria-label="新しいパスワードを表示">
                    <svg class="password-toggle-icon password-toggle-show" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                      <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.12 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"></path>
                      <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM6.5 8a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0z"></path>
                    </svg>
                    <svg class="password-toggle-icon password-toggle-hide" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                      <path d="M13.359 11.238C14.428 10.141 15.141 8.99 15.562 8c-.74-1.739-2.878-4.5-7.562-4.5-1.153 0-2.188.167-3.118.468l.787.787A8.99 8.99 0 0 1 8 4.5c3.866 0 5.79 2.14 6.59 3.5-.278.473-.709 1.12-1.317 1.778l.086.086z"></path>
                      <path d="M11.297 9.176a3.5 3.5 0 0 0-4.473-4.473l.823.823a2.5 2.5 0 0 1 2.827 2.827l.823.823z"></path>
                      <path d="M4.11 5.696A13.346 13.346 0 0 0 1.613 8c.795 1.36 2.719 3.5 6.387 3.5 1.294 0 2.397-.266 3.334-.697l.77.77C11.013 12.181 9.64 12.5 8 12.5 3.316 12.5 1.178 9.739.438 8c.45-1.053 1.282-2.336 2.466-3.462l1.206 1.158z"></path>
                      <path d="M3.354 1.646a.5.5 0 1 0-.708.708l10 10a.5.5 0 0 0 .708-.708l-10-10z"></path>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="field-block">
                <div class="field-header-row">
                  <label class="field-label" for="confirmPassword">新しいパスワード（確認用）</label>
                  <span class="required-badge">必須</span>
                </div>
                <div class="password-input-wrap">
                  <input id="confirmPassword" class="form-control form-control-lg" type="password" placeholder="同じパスワードを再入力">
                  <button class="password-visibility-toggle" type="button" data-password-toggle="confirmPassword" aria-label="確認用パスワードを表示">
                    <svg class="password-toggle-icon password-toggle-show" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                      <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.12 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"></path>
                      <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM6.5 8a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0z"></path>
                    </svg>
                    <svg class="password-toggle-icon password-toggle-hide" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                      <path d="M13.359 11.238C14.428 10.141 15.141 8.99 15.562 8c-.74-1.739-2.878-4.5-7.562-4.5-1.153 0-2.188.167-3.118.468l.787.787A8.99 8.99 0 0 1 8 4.5c3.866 0 5.79 2.14 6.59 3.5-.278.473-.709 1.12-1.317 1.778l.086.086z"></path>
                      <path d="M11.297 9.176a3.5 3.5 0 0 0-4.473-4.473l.823.823a2.5 2.5 0 0 1 2.827 2.827l.823.823z"></path>
                      <path d="M4.11 5.696A13.346 13.346 0 0 0 1.613 8c.795 1.36 2.719 3.5 6.387 3.5 1.294 0 2.397-.266 3.334-.697l.77.77C11.013 12.181 9.64 12.5 8 12.5 3.316 12.5 1.178 9.739.438 8c.45-1.053 1.282-2.336 2.466-3.462l1.206 1.158z"></path>
                      <path d="M3.354 1.646a.5.5 0 1 0-.708.708l10 10a.5.5 0 0 0 .708-.708l-10-10z"></path>
                    </svg>
                  </button>
                </div>
              </div>

              <div id="passwordInlineFeedback"></div>

              <div class="form-actions mt-4">
                <button id="savePasswordButton" class="btn btn-primary" type="button">変更を確定する</button>
              </div>
            </form>
          </section>
        </div>

        <div class="col-12 col-xl-5">
          <section class="sample-section password-guide-section">
            <div class="section-heading-row mb-4">
              <div>
                <h2 class="card-title mb-2">パスワード要件</h2>
              </div>
            </div>

            <p class="rule-summary mb-3">次の要件を満たすパスワードを入力してください。</p>

            <div class="rule-card mb-3">
              <ul class="rule-list mb-0">
                <li>8文字以上32文字以下</li>
                <li>英大文字・英小文字・数字・記号のうち3種類以上を含む</li>
              </ul>
            </div>
          </section>
        </div>
      </div>

      <div class="account-footer-action text-center mt-4">
        <a class="btn btn-outline-secondary" href="./account.html">アカウント情報に戻る</a>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../../../js/student/shared/components.js"></script>
  <script src="../../../js/student/shared/feedback.js"></script>
  <script src="../../../js/student/account/password.js"></script>
</body>
</html>
