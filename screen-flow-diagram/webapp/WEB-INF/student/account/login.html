<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Process Evaluator - ログイン</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Template Styles -->
  <link href="../../../css/template/template.css" rel="stylesheet">
  <link href="../../../css/student/account/login.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <section class="login-hero-section mx-auto" style="max-width: 760px;">
        <div class="hero-card p-5 rounded-4">
          <div class="hero-brand text-center mb-4">
            <a class="navbar-brand d-flex align-items-center justify-content-center py-5" href="#">
              <svg class="me-3" width="96" height="96" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4.5C4 3.67 4.67 3 5.5 3h13c.83 0 1.5.67 1.5 1.5v15c0 .83-.67 1.5-1.5 1.5h-13A1.5 1.5 0 0 1 4 19.5v-15zM5.5 4a.5.5 0 0 0-.5.5V8h15V4.5a.5.5 0 0 0-.5-.5h-14zM5 9v10.5c0 .28.22.5.5.5h13a.5.5 0 0 0 .5-.5V9H5z"/>
                <path d="M8.75 13.5L7.25 12l1.5-1.5m6.5 3L16.75 12l-1.5-1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M11 13.5h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <div class="brand-text text-start">
                <span class="brand-line d-block">Programming</span>
                <span class="brand-line d-block">Process</span>
                <span class="brand-line d-block">Evaluator</span>
              </div>
            </a>
            <p class="hero-subtitle text-muted mt-3 mb-0">配布されたアカウントにログインしてください。</p>
          </div>

          <div class="sample-card login-panel p-4">
            <h3 class="card-title">生徒ログイン</h3>
            <form id="student-login" class="login-form">
              <div class="mb-3">
                <label for="studentId" class="form-label">ID</label>
                <input type="text" class="form-control" id="studentId" placeholder="st000" required>
              </div>
              <div class="mb-3">
                <label for="studentPassword" class="form-label">パスワード</label>
                <input type="password" class="form-control" id="studentPassword" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 btn-lg">ログイン</button>
            </form>
            <div class="mt-4 text-center">
              <a id="teacher-login" class="btn btn-link text-decoration-none" href="../../teacher/account/index.html">教師用ログインはこちら</a>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../../../js/student/account/login.js"></script>
</body>
</html>
