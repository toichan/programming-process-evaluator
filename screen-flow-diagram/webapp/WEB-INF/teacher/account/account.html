<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Process Evaluator - 教師ホーム</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="../../../css/teacher/shared/components.css" rel="stylesheet">
  <link href="../../../css/template/template.css" rel="stylesheet">
  <link href="../../../css/teacher/account/account.css" rel="stylesheet">
</head>
<body>
  <!-- 共有コンポーネント（サイドメニュー、ヘッダー）が自動的に挿入されます -->

  <!-- メインコンテンツ -->
  <main class="flex-grow-1">
      <!-- ページコンテンツ -->
      <div class="page-content py-5">
        <div class="container-fluid px-4">
          <!-- ウェルカムセクション -->
          <section class="history-hero mb-4">
            <div>
              <span class="hero-kicker">Teacher Dashboard</span>
              <h1 class="section-title mb-2">生徒アカウント管理</h1>
              <p class="hero-description mb-0">生徒アカウントの一元管理、作成、確認、エクスポートができます。</p>
            </div>
            <div class="hero-stats">
              <div class="stat-card">
                <div class="stat-label">登録アカウント数</div>
                <div class="stat-value">42</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">対象学校</div>
                <div class="stat-value">2校</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">対象クラス</div>
                <div class="stat-value">5組</div>
              </div>
            </div>
          </section>

          <!-- 操作・フィルタパネル -->
          <section class="panel-card mb-4">
            <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
              <h2 class="summary-heading mb-0"></h2>
              <div class="action-buttons">
                <button class="btn btn-primary account-create-btn" data-bs-toggle="modal" data-bs-target="#createAccountModal">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                  新規作成
                </button>
                <button class="btn btn-primary btn-sm" onclick="exportCSV()">
                  CSVエクスポート
                </button>
              </div>
            </div>

            <!-- フィルタセクション -->
            <div class="filter-grid mb-4">
              <div>
                <label class="form-label">並び順</label>
                <select class="form-select form-select-sm" id="sortBy">
                  <option value="idAsc" selected>生徒ID（昇順）</option>
                  <option value="idDesc">生徒ID（降順）</option>
                  <option value="createdDesc">作成日時（新しい順）</option>
                  <option value="createdAsc">作成日時（古い順）</option>
                </select>
              </div>
              <div>
                <label class="form-label">検索</label>
                <input type="text" class="form-control form-control-sm" placeholder="生徒IDで検索" id="searchInput">
              </div>
              <div>
                <label class="form-label">学校</label>
                <select class="form-select form-select-sm" id="filterSchool">
                  <option selected>すべて</option>
                  <option>国際中等</option>
                  <option>附属高校</option>
                </select>
              </div>
              <div>
                <label class="form-label">クラス</label>
                <select class="form-select form-select-sm" id="filterClass">
                  <option selected>すべて</option>
                  <option>1年A組</option>
                  <option>1年B組</option>
                  <option>1年C組</option>
                  <option>1年D組</option>
                  <option>1年E組</option>
                  <option>1年F組</option>
                  <option>1年G組</option>
                  <option>1年H組</option>
                  <option>4年1組</option>
                  <option>4年2組</option>
                  <option>4年3組</option>
                  <option>4年4組</option>
                </select>
              </div>
            </div>
          </section>

          <!-- テーブルパネル -->
          <section class="panel-card">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th style="width: 8%;">ID</th>
                    <th style="width: 24%;">パスワード</th>
                    <th style="width: 16%;">学校</th>
                    <th style="width: 12%;">クラス</th>
                    <th style="width: 20%;">作成日時</th>
                    <th style="width: 10%;">詳細</th>
                    <th style="width: 10%;">操作</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><code>s001</code></td>
                    <td class="password-cell">
                      <div class="password-content">
                        <span class="password-mask" data-password="password123">••••••••</span>
                        <button class="btn btn-sm btn-icon password-toggle" type="button" onclick="togglePassword(this)" title="パスワード表示">
                          <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                          </svg>
                        </button>
                      </div>
                    </td>
                    <td>国際中等</td>
                    <td>1年A組</td>
                    <td>2026-05-10 10:30:00</td>
                    <td>
                      <button class="btn btn-sm btn-outline-primary" onclick="openAccountDetail(this)">表示</button>
                    </td>
                    <td>
                      <button class="btn btn-sm btn-outline-danger" onclick="deleteAccount(this)">削除</button>
                    </td>
                  </tr>
                  <tr>
                    <td><code>s002</code></td>
                    <td class="password-cell">
                      <div class="password-content">
                        <span class="password-mask" data-password="password456">••••••••</span>
                        <button class="btn btn-sm btn-icon password-toggle" type="button" onclick="togglePassword(this)" title="パスワード表示">
                          <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                          </svg>
                        </button>
                      </div>
                    </td>
                    <td>国際中等</td>
                    <td>1年A組</td>
                    <td>2026-05-10 10:30:00</td>
                    <td>
                      <button class="btn btn-sm btn-outline-primary" onclick="openAccountDetail(this)">表示</button>
                    </td>
                    <td>
                      <button class="btn btn-sm btn-outline-danger" onclick="deleteAccount(this)">削除</button>
                    </td>
                  </tr>
                  <tr>
                    <td><code>s003</code></td>
                    <td class="password-cell">
                      <div class="password-content">
                        <span class="password-mask" data-password="password789">••••••••</span>
                        <button class="btn btn-sm btn-icon password-toggle" type="button" onclick="togglePassword(this)" title="パスワード表示">
                          <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                          </svg>
                        </button>
                      </div>
                    </td>
                    <td>附属高校</td>
                    <td>1年B組</td>
                    <td>2026-05-10 10:35:00</td>
                    <td>
                      <button class="btn btn-sm btn-outline-primary" onclick="openAccountDetail(this)">表示</button>
                    </td>
                    <td>
                      <button class="btn btn-sm btn-outline-danger" onclick="deleteAccount(this)">削除</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

        </div>

        <div class="modal fade" id="accountDetailModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">ログイン履歴</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <div class="account-detail-head">
                  <div><span class="detail-label">ID</span><span class="detail-value" id="detailStudentId">-</span></div>
                  <div><span class="detail-label">学校</span><span class="detail-value" id="detailSchool">-</span></div>
                  <div><span class="detail-label">クラス</span><span class="detail-value" id="detailClass">-</span></div>
                </div>
                <div class="detail-table-wrap mt-3">
                  <table class="table table-sm align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th style="width: 26%;">日時</th>
                        <th style="width: 20%;">結果</th>
                        <th style="width: 22%;">IP</th>
                        <th style="width: 32%;">端末</th>
                      </tr>
                    </thead>
                    <tbody id="loginHistoryTableBody"></tbody>
                  </table>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">閉じる</button>
              </div>
            </div>
          </div>
        </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../../../js/teacher/shared/components.js"></script>
  <script src="../../../js/teacher/account/account.js"></script>
</body>
</html>
