<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Process Evaluator - 提出課題確認</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.css" rel="stylesheet">
  <link href="../../../css/teacher/shared/components.css" rel="stylesheet">
  <link href="../../../css/teacher/shared/feedback.css" rel="stylesheet">
  <link href="../../../css/template/template.css" rel="stylesheet">
  <link href="../../../css/teacher/submission/submission.css" rel="stylesheet">
</head>
<body>
  <main class="flex-grow-1">
    <div class="page-content py-5">
      <div class="container-fluid px-4">
        <section class="submission-hero mb-4">
          <div>
            <span class="hero-kicker">Submission Review</span>
            <h1 class="section-title mb-2">提出課題確認</h1>
            <p class="hero-description mb-0">生徒の提出課題一覧を確認し、提出コードと入出力チェック結果を詳細モーダルで連続確認できます。</p>
          </div>
          <div class="hero-stats">
            <div class="stat-card">
              <div class="stat-label">表示件数</div>
              <div class="stat-value" id="visibleCount">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">全件一致</div>
              <div class="stat-value" id="fullMatchCount">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">平均一致率</div>
              <div class="stat-value" id="avgMatchRate">0%</div>
            </div>
          </div>
        </section>

        <section class="panel-card mb-4">
          <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
            <div>
              <span class="hero-kicker mb-1 d-inline-block">Submission Filters</span>
              <h2 class="summary-heading mb-0">提出一覧フィルタ</h2>
            </div>
            <div class="action-buttons">
              <button class="btn btn-outline-secondary btn-sm" type="button" onclick="refreshSubmissionRows()">更新</button>
              <button class="btn btn-outline-primary btn-sm" type="button" onclick="bulkSaveSubmissionFiles()">ファイルを一括ダウンロード</button>
              <button class="btn btn-primary btn-sm" type="button" onclick="exportSubmissionCSV()">CSVエクスポート</button>
            </div>
          </div>
          <div class="filter-grid">
            <div>
              <label class="form-label" for="searchInput">検索</label>
              <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="生徒ID / 課題名で検索">
            </div>
            <div>
              <label class="form-label" for="filterSchool">学校</label>
              <select class="form-select form-select-sm" id="filterSchool">
                <option selected>すべて</option>
                <option>国際中等</option>
                <option>附属高校</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="filterClass">クラス</label>
              <select class="form-select form-select-sm" id="filterClass">
                <option selected>すべて</option>
                <option>1年A組</option>
                <option>1年B組</option>
                <option>4年2組</option>
                <option>4年4組</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="filterTask">課題</label>
              <select class="form-select form-select-sm" id="filterTask">
                <option selected>すべて</option>
                <option>じゃんけん判定</option>
                <option>在庫管理</option>
                <option>経路探索</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="filterLevel">難易度</label>
              <select class="form-select form-select-sm" id="filterLevel">
                <option selected>すべて</option>
                <option>初級</option>
                <option>中級</option>
                <option>上級</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="filterConsent">研究同意</label>
              <select class="form-select form-select-sm" id="filterConsent">
                <option selected>すべて</option>
                <option>同意</option>
                <option>未確認</option>
                <option>不同意</option>
              </select>
            </div>
          </div>
        </section>

        <section class="panel-card">
          <div class="table-responsive">
            <table class="table table-hover align-middle" id="submissionTable">
              <thead class="table-light">
                <tr>
                  <th class="sortable" data-sort-key="studentId">生徒ID</th>
                  <th class="sortable" data-sort-key="school">学校</th>
                  <th class="sortable" data-sort-key="className">クラス</th>
                  <th class="sortable" data-sort-key="taskTitle">課題名</th>
                  <th class="sortable" data-sort-key="level">難易度</th>
                  <th class="sortable" data-sort-key="matchRate">一致件数</th>
                  <th class="sortable" data-sort-key="submittedAt">提出日時</th>
                  <th class="sortable" data-sort-key="consent">研究同意</th>
                  <th>詳細</th>
                </tr>
              </thead>
              <tbody id="submissionTableBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div class="modal fade" id="submissionDetailModal" tabindex="-1" aria-labelledby="submissionDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="submissionDetailModalLabel">提出課題詳細</h5>
          <div class="d-flex align-items-center gap-2 ms-auto">
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="downloadSubmittedCodeFile()">ファイルをダウンロード</button>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
          </div>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <p class="detail-meta mb-0" id="detailMeta">-</p>
          </div>
          <section class="detail-card mb-3">
            <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-2">
              <h3 class="detail-title mb-0">入出力チェック結果</h3>
              <div class="match-summary" id="ioMatchSummary">0/0件一致</div>
            </div>
            <div class="table-responsive">
              <table class="table io-result-table mb-0">
                <thead>
                  <tr>
                    <th>入力</th>
                    <th>期待する出力</th>
                    <th>実際の出力</th>
                    <th class="text-center">結果</th>
                  </tr>
                </thead>
                <tbody id="ioResultTableBody"></tbody>
              </table>
            </div>
          </section>

          <div class="detail-grid">
            <section class="detail-card">
              <div class="d-flex justify-content-between align-items-center mb-2 gap-2 flex-wrap">
                <h3 class="detail-title mb-0">提出コード（読み取り専用）</h3>
              </div>
              <textarea id="submittedCodeView" class="code-source" spellcheck="false"></textarea>
            </section>

            <section class="detail-card">
              <div class="d-flex justify-content-between align-items-center mb-2 gap-2 flex-wrap">
                <h3 class="detail-title mb-0">動作確認用コード（編集・実行可）</h3>
                <span class="badge text-bg-warning">提出データは変更されません</span>
              </div>
              <textarea id="workCodeEditor" class="code-source" spellcheck="false"></textarea>
              <div class="d-flex align-items-center gap-2 mt-2">
                <button type="button" class="btn btn-primary btn-sm" id="runWorkCodeButton">実行</button>
                <span class="small text-muted">確認用コードのみ実行されます</span>
              </div>
              <div class="run-output-wrap mt-2">
                <div class="output-label">実行結果</div>
                <pre id="workCodeOutput">未実行です。</pre>
              </div>
            </section>
          </div>
        </div>
        <div class="modal-footer submission-detail-footer">
          <div class="small text-muted" id="detailPagerText">1 / 1</div>
          <div class="d-flex gap-2 detail-footer-actions">
            <button type="button" class="btn btn-outline-secondary" id="detailPrevButton">戻る</button>
            <button type="button" class="btn btn-outline-secondary" id="detailNextButton">次へ</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/shell/shell.js"></script>
  <script src="../../../js/teacher/shared/components.js"></script>
  <script src="../../../js/teacher/shared/feedback.js"></script>
  <script src="../../../js/teacher/submission/submission.js"></script>
</body>
</html>
