<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Process Evaluator - 授業演習コード確認</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="../../../css/teacher/shared/components.css" rel="stylesheet">
  <link href="../../../css/teacher/shared/feedback.css" rel="stylesheet">
  <link href="../../../css/template/template.css" rel="stylesheet">
  <link href="../../../css/teacher/exercise/exercise.css" rel="stylesheet">
</head>
<body>
  <main class="flex-grow-1">
    <div class="page-content py-5">
      <div class="container-fluid px-4">
        <section class="exercise-hero mb-4">
          <div>
            <span class="hero-kicker">Exercise Monitor</span>
            <h1 class="section-title mb-2">授業演習コード確認</h1>
            <p class="hero-description mb-0">学校・クラスごとに授業演習データを一覧表示し、生徒ごとのフォルダ構成、代表Path、最終保存コードを確認できます。</p>
          </div>
          <div class="hero-stats">
            <div class="stat-card">
              <div class="stat-label">表示件数</div>
              <div class="stat-value" id="visibleCount">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">ファイル数</div>
              <div class="stat-value" id="visibleFileCount">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">最終更新</div>
              <div class="stat-value" id="latestUpdatedAt">-</div>
            </div>
          </div>
        </section>

        <section class="panel-card mb-4">
          <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
            <div>
              <span class="hero-kicker mb-1 d-inline-block">Exercise Filters</span>
              <h2 class="summary-heading mb-0">授業演習フィルタ</h2>
            </div>
            <div class="action-buttons">
              <button class="btn btn-outline-secondary btn-sm" type="button" onclick="refreshExerciseRows()">更新</button>
              <button class="btn btn-outline-primary btn-sm" type="button" onclick="bulkSaveExerciseFiles()">ファイルを一括ダウンロード</button>
              <button class="btn btn-primary btn-sm" type="button" onclick="exportExerciseCSV()">CSVエクスポート</button>
            </div>
          </div>
          <div class="filter-grid">
            <div>
              <label class="form-label" for="searchInput">生徒ID</label>
              <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="生徒IDで検索">
            </div>
            <div>
              <label class="form-label" for="filterSchool">学校</label>
              <select class="form-select form-select-sm" id="filterSchool">
                <option selected>すべて</option>
                <option>国際中等</option>
                <option>附属高校</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="filterClass">クラス</label>
              <select class="form-select form-select-sm" id="filterClass">
                <option selected>すべて</option>
                <option>1年A組</option>
                <option>1年B組</option>
                <option>4年2組</option>
                <option>4年4組</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="filterConsent">研究同意</label>
              <select class="form-select form-select-sm" id="filterConsent">
                <option selected>すべて</option>
                <option>同意</option>
                <option>未確認</option>
                <option>不同意</option>
              </select>
            </div>
          </div>
        </section>

        <div class="row g-4 align-items-start">
          <div class="col-12">
            <section class="panel-card h-100">
              <div class="table-responsive exercise-table-wrap">
                <table class="table table-hover align-middle" id="exerciseTable">
                  <thead class="table-light">
                    <tr>
                      <th class="sortable" data-sort-key="studentId">生徒ID</th>
                      <th class="sortable" data-sort-key="school">学校</th>
                      <th class="sortable" data-sort-key="className">クラス</th>
                      <th class="sortable" data-sort-key="fileCount">ファイル数</th>
                      <th class="sortable" data-sort-key="updatedAt">最終更新</th>
                      <th class="sortable" data-sort-key="consent">研究同意</th>
                      <th>詳細</th>
                    </tr>
                  </thead>
                  <tbody id="exerciseTableBody"></tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade exercise-detail-modal" id="exerciseDetailModal" tabindex="-1" aria-labelledby="exerciseDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exerciseDetailModalLabel">授業演習詳細</h5>
          <div class="modal-header-tools">
            <div class="modal-header-actions">
              <button class="btn btn-outline-primary btn-sm" type="button" onclick="saveCurrentExerciseFile()">ファイルをダウンロード</button>
              <button class="btn btn-primary btn-sm" type="button" onclick="downloadExerciseFolderZip()">フォルダをZIPダウンロード</button>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
          </div>
        </div>
        <div class="modal-body">
          <div class="exercise-detail-top-row mb-3">
            <p class="detail-meta mb-0" id="detailMeta">-</p>
            <div class="detail-chip-group">
              <span class="detail-chip detail-chip-muted" id="detailFileCountChip">-</span>
            </div>
          </div>
          <section class="exercise-summary-card mb-3">
            <div class="exercise-summary-main">
              <div class="exercise-summary-kicker">Selected File</div>
              <div class="exercise-summary-title" id="detailStudentId">-</div>
              <div class="exercise-summary-subtitle" id="detailStudentMeta">-</div>
            </div>
            <div class="exercise-summary-stats">
              <article class="exercise-summary-stat">
                <div class="exercise-summary-label">ファイル名</div>
                <div class="exercise-summary-value" id="detailFileName">-</div>
              </article>
              <article class="exercise-summary-stat">
                <div class="exercise-summary-label">保存日時</div>
                <div class="exercise-summary-value" id="detailFileUpdatedAt">-</div>
              </article>
              <article class="exercise-summary-stat exercise-summary-stat-wide">
                <div class="exercise-summary-label">Path</div>
                <div class="exercise-summary-value exercise-summary-path" id="detailFilePath">-</div>
              </article>
            </div>
          </section>

          <div class="exercise-detail-grid">
            <section class="detail-card exercise-tree-card">
              <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
                <h3 class="detail-title mb-0">フォルダ・ファイル構成</h3>
                <span class="small text-muted">最終保存時点のみ表示</span>
              </div>
              <div id="exerciseTree" class="exercise-tree" aria-label="授業演習フォルダツリー"></div>
            </section>

            <section class="detail-card exercise-code-card">
              <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
                <h3 class="detail-title mb-0">最終保存コード</h3>
              </div>
              <textarea id="exerciseCodeViewer" class="code-source" spellcheck="false"></textarea>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
  <script src="../../../js/teacher/shared/components.js"></script>
  <script src="../../../js/teacher/shared/feedback.js"></script>
  <script src="../../../js/teacher/exercise/exercise.js"></script>
</body>
</html>
